{{define "plugin/hn/style"}}<style>
/* hn base. Contrast (WCAG AA): muted #6b6b6b on #f6f6ef 4.91:1 (#828282 was 3.54:1), white on #c23b22 5.33:1 */
:where(:root){--hn-accent:#c23b22;--hn-bg:#f6f6ef;--hn-text:#000;--hn-muted:#6b6b6b;--hn-dead:#bfbfbf;--hn-font:Verdana,Geneva,"DejaVu Sans",sans-serif;--hn-mono:"Courier New",Courier,monospace;--hn-size:10pt;--hn-size-sub:7pt;--hn-size-comment:9pt;--hn-indent:40px}
:where(.hn-stories){list-style:none;margin:0;padding:0}
:where(.hn-stories,.hn-item-head,.hn-form-tbl,div.hn-user,.hn-login,.hn-threads,.hn-note,.hn-notice){font-family:var(--hn-font);font-size:var(--hn-size);color:var(--hn-text)}
:where(.hn-ub){font-family:var(--hn-font);font-size:var(--hn-size)}
:where(.hn-story){display:grid;grid-template-columns:28px 14px 1fr;column-gap:2px;padding:2px 0}
:where(.hn-rank){color:var(--hn-muted);text-align:right;padding-right:2px}
:where(.hn-vote-cell){text-align:center}
:where(.hn-vote-form){display:inline;margin:0}
:where(.hn-vote-form button){font-size:10px;line-height:10px;color:var(--hn-muted);background:none;border:0;cursor:pointer}
:where(.hn-vote-form button){padding:0}
:where(.hn-title){line-height:1.25}:where(.hn-title a){color:var(--hn-text);text-decoration:none}
:where(.hn-site,.hn-site a){font-size:8pt;color:var(--hn-muted)}
:where(.hn-sub){grid-column:3;font-size:var(--hn-size-sub);color:var(--hn-muted);padding:1px 0 5px}
:where(.hn-sub a,.hn-act button){color:var(--hn-muted)}:where(.hn-sub a:hover,.hn-sub a:focus){text-decoration:underline}
:where(.hn-act){display:inline;margin:0}:where(.hn-act button){font:inherit;background:none;border:0;padding:0;cursor:pointer}
:where(.hn-notice){color:var(--hn-accent)}:where(.hn-note){color:var(--hn-muted);max-width:560px;margin:10px 0 0 10px}
:where(div.hn-more){padding:8px 0 0 44px}
:where(.hn-item-head){padding:0 0 8px}:where(.hn-item-text){margin:4px 0 8px 44px;max-width:700px;font-size:var(--hn-size-comment)}
:where(.hn-form-tbl){margin:8px 0 0 10px;border-collapse:collapse}:where(.hn-form-tbl td){padding:3px 6px 3px 0;vertical-align:top}
:where(.hn-lbl){color:var(--hn-muted);text-align:right;white-space:nowrap}
:where(.hn-form-tbl input,.hn-form-tbl textarea,div.hn-user input,div.hn-user textarea){font:10pt var(--hn-mono);border:1px solid #888;padding:1px 2px}
:where(.hn-form-tbl textarea){width:500px;max-width:calc(100vw - 110px);height:110px}
:where(div.hn-user input[type=text]){width:30em;max-width:100%}:where(div.hn-user table){margin:8px 0 0 10px}:where(div.hn-user td,div.hn-user th){padding:2px 8px 2px 0;text-align:left;vertical-align:top}:where(div.hn-user th){color:var(--hn-muted);font-weight:normal}
:where(.hn-login){padding:12px 10px}:where(.hn-login input){font:inherit}:where(.hn-login .hn-note){font-size:8pt}
:where(.hn-ub){text-align:right;padding:2px 4px}:where(.hn-ub a){color:inherit}
:where(.hn-out){display:inline;margin:0}:where(.hn-out button){background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
:where(.hn-threads .hn-head){font-size:8pt;color:var(--hn-muted)}:where(.hn-threads .hn-head a){color:var(--hn-muted)}
:where(.hn-threads .hn-text){font-size:var(--hn-size-comment);line-height:1.35;margin:3px 0 2px;max-width:800px}
:where(.hn-threads .hn-text p){margin:6px 0 0}:where(.hn-threads pre){font-family:var(--hn-mono);white-space:pre-wrap}
:where(.hn-reply){font-size:var(--hn-size-sub)}:where(.hn-reply a){text-decoration:underline}
:where(.hn-threads .hn-dead .hn-text){color:var(--hn-dead)}:where(.hn-threads .hn-faint .hn-text){color:#5a5a5a}
:where(.hn-threads){padding:4px}:where(.hn-threads .hn-c){margin-bottom:12px}:where(.hn-threads form){display:inline;margin:0}
:where(.hn-threads .hn-c){margin-left:calc(var(--hn-d,0) * var(--hn-indent))}
:where(.hn-reply-page .hn-note,.hn-replyform){font-family:var(--hn-font);font-size:var(--hn-size);color:var(--hn-text)}
:where(.hn-replyform){display:block;margin:8px 0 0 4px}:where(.hn-replyform input[type=text]){font:10pt var(--hn-mono);border:1px solid #888;padding:1px 2px;max-width:100%}
:where(.hn-reply-page .hn-hp){position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
:where(.hn-sr){position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
:where(.hn-title,.hn-text,.hn-item-text){overflow-wrap:anywhere}
@media (max-width:750px){:where(:root){--hn-indent:14px}:where(.hn-story){grid-template-columns:22px 14px 1fr}:where(.hn-form-tbl,.hn-form-tbl tbody,.hn-form-tbl tr,.hn-form-tbl td){display:block}:where(.hn-lbl){text-align:left}:where(.hn-form-tbl textarea,.hn-form-tbl input[type=text],div.hn-user input[type=text],div.hn-user textarea){width:100%;max-width:100%;box-sizing:border-box}:where(.hn-item-text){margin-left:0}:where(div.hn-more){padding-left:24px}}
</style>{{end}}
