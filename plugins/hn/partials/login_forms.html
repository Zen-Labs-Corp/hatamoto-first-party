{{define "plugin/hn/login_forms"}}<b>Login</b>
<form method="post" action="{{.login_action}}"><table class="hn-form-tbl">
<tr><td><label for="hn-login-user">username:</label></td><td><input id="hn-login-user" type="text" name="username" maxlength="15" autocomplete="username" autocapitalize="off" spellcheck="false" required></td></tr>
<tr><td><label for="hn-login-pw">password:</label></td><td><input id="hn-login-pw" type="password" name="password" maxlength="72" autocomplete="current-password" required></td></tr>
</table><input type="hidden" name="next" value="{{.next}}"><p><button type="submit">login</button></p></form>
{{if .reset_href}}<p><a href="{{.reset_href}}">Forgot your password?</a></p>{{end}}
<p class="hn-note">Signed up with an email link? <a href="{{.email_signin_href}}">Sign in by email</a>.</p>
<b>Create Account</b>
<form method="post" action="{{.signup_action}}"><table class="hn-form-tbl">
<tr><td><label for="hn-signup-user">username:</label></td><td><input id="hn-signup-user" type="text" name="username" maxlength="15" autocomplete="username" autocapitalize="off" spellcheck="false" required></td></tr>
<tr><td><label for="hn-signup-pw">password:</label></td><td><input id="hn-signup-pw" type="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" required></td></tr>
</table><p><button type="submit">create account</button></p></form>
<p class="hn-note">2 to 15 letters, digits, dashes and underscores. Passwords are 8 to 72 characters. No email needed.</p>{{end}}
