{{define "plugin/hn/comment_vote"}}{{if .vote}}<span class="{{.vote_cell}}" data-hn-comment="{{.id}}">{{if .can_up}}<form class="hn-vote-form" method="post" action="/p/hn/vote/comment/{{.id}}"><input type="hidden" name="how" value="up"><input type="hidden" name="next" value="{{.next}}"><button type="submit" title="upvote" aria-label="upvote">▲</button></form>{{end}}{{if .can_down}}<form class="hn-vote-form" method="post" action="/p/hn/vote/comment/{{.id}}"><input type="hidden" name="how" value="down"><input type="hidden" name="next" value="{{.next}}"><button type="submit" title="downvote" aria-label="downvote">▼</button></form>{{end}}{{if .can_un}}<form class="hn-vote-form" method="post" action="/p/hn/vote/comment/{{.id}}"><input type="hidden" name="how" value="un"><input type="hidden" name="next" value="{{.next}}"><button type="submit">unvote</button></form>{{end}}</span> {{end}}{{end}}
