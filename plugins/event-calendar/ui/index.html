<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Repeating events</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <h1>Repeating events</h1>
    <p id="notice" class="notice" hidden></p>
    <p id="hint" class="hint" hidden></p>
    <p id="state" class="muted"></p>

    <table id="events" hidden>
      <thead>
        <tr><th>Event</th><th>Repeats</th><th>Next dates</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <section id="duplicate" hidden>
      <h2>Duplicate an event</h2>
      <label>Event <select id="dup-event"></select></label>
      <label>Move dates by <input id="dup-shift" type="number" value="0" step="1"> days</label>
      <button id="dup-go" type="button">Duplicate event...</button>
    </section>

    <footer class="muted">Skip / Change time / Restore stage a change in Changes (review, then publish).</footer>
  </main>
  <script src="/plugin-ui/_sdk/bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
