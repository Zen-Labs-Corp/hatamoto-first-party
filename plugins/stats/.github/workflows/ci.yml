# Builds and tests the plugin. It needs the public Hatamoto SDK (hatamoto.dev/sdk),
# so it only passes once that module is fetchable.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.27.3
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build the wasm plugin
        run: |
          set -euo pipefail
          mkdir -p build
          CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o build/plugin.wasm .
          cp plugin.json build/plugin.json
          for d in migrations ui assets; do
            if [ -d "$d" ]; then cp -r "$d" "build/$d"; fi
          done
          test -s build/plugin.wasm
          built=$(jq -r .name build/plugin.json)
          if [ "$built" != "stats" ]; then
            echo "plugin.json name $built does not match stats" >&2
            exit 1
          fi
