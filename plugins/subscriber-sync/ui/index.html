<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Subscriber sync</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p id="notice" class="notice" hidden></p>

    <section>
      <dl id="status"></dl>
      <p id="setup" class="notice" hidden>Not set up yet: choose a provider, API key and list in Settings.</p>
      <div class="row">
        <button id="test" type="button">Test connection</button>
        <span id="test-result" role="status"></span>
      </div>
    </section>

    <section>
      <h2>Recent deliveries (last 100, kept 30 days, no email addresses)</h2>
      <table id="log">
        <thead><tr><th>Time</th><th>Form</th><th>Status</th><th class="num">Code</th><th>Reason</th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="empty" class="muted" hidden>No deliveries yet.</p>
    </section>
  </main>
  <script src="/plugin-ui/_sdk/bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
