# Vets, tests and builds every plugin a change touches (a change outside
# plugins/ touches all of them), with the same script developers run:
# scripts/build-plugin.sh. Checks every kit a change touches with
# scripts/check-kit.sh against the core pinned in .hatamoto-core. Also proves the
# template still scaffolds and builds. Loads every built plugin through the core
# loader at the .hatamoto-core pin (scripts/load-check.sh).
# Needs the public Hatamoto SDK (hatamoto.dev/sdk) to be fetchable.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.3
  GOWORK: 'off'
  GOFLAGS: -mod=readonly

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      kits: ${{ steps.list.outputs.kits }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            plugins=$(scripts/changed-plugins.sh --json "$BASE_SHA" HEAD)
            kits=$(scripts/changed-kits.sh --json "$BASE_SHA" HEAD)
          else
            plugins=$(scripts/changed-plugins.sh --json)
            kits=$(scripts/changed-kits.sh --json)
          fi
          echo "plugins=$plugins" >>"$GITHUB_OUTPUT"
          echo "plugins: $plugins"
          echo "kits=$kits" >>"$GITHUB_OUTPUT"
          echo "kits: $kits"

  build:
    needs: changed
    if: needs.changed.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changed.outputs.plugins) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build ${{ matrix.plugin }}
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: scripts/build-plugin.sh "$PLUGIN"
      - name: Load ${{ matrix.plugin }} through the core loader (commit pinned in .hatamoto-core)
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: scripts/load-check.sh "$PLUGIN"

  kits:
    needs: changed
    if: needs.changed.outputs.kits != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJSON(needs.changed.outputs.kits) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Core CLI (commit pinned in .hatamoto-core)
        run: |
          bin=$(scripts/hatamoto-bin.sh)
          echo "HATAMOTO_BIN=$bin" >>"$GITHUB_ENV"
      - name: Check ${{ matrix.kit }}
        env:
          KIT: ${{ matrix.kit }}
        run: scripts/check-kit.sh "$KIT"
      - name: check-kit.sh refuses broken kits
        run: scripts/test-check-kit.sh
      - name: changed-kits.sh lists the right kits
        run: scripts/test-changed-kits.sh

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Scaffold and build a plugin from template/
        run: scripts/new-plugin.sh template-check "Template check."
      - name: Load the scaffold through the core loader
        run: scripts/load-check.sh plugins/template-check
      - name: load-check.sh refuses files the core loader refuses
        run: scripts/test-load-check.sh

  # One stable check name for the branch ruleset (the matrix jobs are named per item), so
  # GitHub auto-merge waits for the whole workflow. A skipped job (nothing changed) counts as passed.
  ci-ok:
    if: always()
    needs: [changed, build, kits, template]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
